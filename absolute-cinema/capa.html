                <p class="texto1">A câmera define como cada cena será apresentada ao público, influenciando emoções, foco e interpretação. O enquadramento, a posição, os movimentos e a distância orientam o olhar do espectador, destacam elementos importantes e fortalecem a narrativa, criando uma experiência cinematográfica envolvente e única.</p>

        </div>
